; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = atmelavr
framework = arduino
board = ATmega328PB
board_build.f_cpu = 8000000L
upload_protocol = usbasp
upload_flags = -B5

; ================================================
; BOOTLOADER PRINTER - 4KB @ 0x7000
; ================================================
[env:bootloader_printer]
extends = common

build_flags =
    -DSLAVE_ADDRESS=0x40        ; I2C Address: 0x40
    -DPRINTER_HARDWARE          ; Hardware type
    -Os
    -fno-exceptions
    -fno-threadsafe-statics
    -mcall-prologues
    -Wl,--section-start=.text=0x7000
    -Wl,--relax

build_src_filter = 
    +<main_bootloader_unified.cpp>

board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD0        ; BOOTSZ=00 (4KB)
board_fuses.efuse = 0xF7

; ================================================
; BOOTLOADER DISPLAY - 4KB @ 0x7000
; ================================================
[env:bootloader_display]
extends = common

build_flags =
    -DSLAVE_ADDRESS=0x41        ; I2C Address: 0x41
    -DDISPLAY_HARDWARE          ; Hardware type
    -Os
    -fno-exceptions
    -fno-threadsafe-statics
    -mcall-prologues
    -Wl,--section-start=.text=0x7000
    -Wl,--relax

build_src_filter = 
    +<main_bootloader_unified.cpp>

board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD0        ; BOOTSZ=00 (4KB)
board_fuses.efuse = 0xF7

