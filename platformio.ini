; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Variante de pantalla. DISPLAY_HAS_INTERNAL_RTC selecciona como se mantiene la
; fecha y hora del display DWIN (ver include/main.h):
;   =1  pantalla nueva: trae RTC de hardware con supercapacitor. Se ajusta una
;       sola vez por RTC_Set (0x009C) y luego mantiene la hora por si misma.
;   =0  pantalla anterior: sin RTC. El MCU repinta la hora cada 500 ms en 0x0010.
; Los envs esp32* compilan para la pantalla nueva y los esp32*_legacy para la
; anterior. main.h aborta la compilacion si la bandera no esta definida, para que
; una eleccion equivocada no llegue a campo como un reloj parpadeando.
; El firmware del ATmega (envs display*) es el mismo para las dos pantallas: solo
; reenvia por UART la direccion que le manda el ESP32.
; ---------------------------------------------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
;upload_port = COM8
lib_deps = 
	chris--a/Keypad@^3.1.1
	northernwidget/DS3231@^1.1.2
	mobizt/ESP_SSLClient@^3.1.3
	arduino-libraries/Ethernet@^2.0.2
build_src_filter = ${env.src_filter}-<mainDisplay.cpp>-<Display.cpp>-<HC05.cpp>-<mainPrinter.cpp>
board_build.partitions = partitions.csv
build_unflags = 
	-std=gnu++11
	-std=gnu11
	-std=gnu++14
	-std=gnu14
build_flags = 
	-D debug_mode
	-D DISPLAY_HAS_INTERNAL_RTC=1
	-std=gnu++17
	-std=gnu17

[env:esp32dev_legacy]
extends = env:esp32dev
build_flags = 
	-D debug_mode
	-D DISPLAY_HAS_INTERNAL_RTC=0
	-std=gnu++17
	-std=gnu17

[env:esp32_debug]
extends = env:esp32dev
build_unflags = 
	-std=gnu++11
	-std=gnu11
	-std=gnu++14
	-std=gnu14
build_flags = 
	-D debug_mode
	-D DISPLAY_HAS_INTERNAL_RTC=1
	-std=gnu++17
	-std=gnu17

[env:esp32_debug_legacy]
extends = env:esp32dev
build_unflags = 
	-std=gnu++11
	-std=gnu11
	-std=gnu++14
	-std=gnu14
build_flags = 
	-D debug_mode
	-D DISPLAY_HAS_INTERNAL_RTC=0
	-std=gnu++17
	-std=gnu17

[env:esp32_release]
extends = env:esp32dev
build_unflags = 
	-std=gnu++11
	-std=gnu11
	-std=gnu++14
	-std=gnu14
build_flags = 
	-D DISPLAY_HAS_INTERNAL_RTC=1
	-std=gnu++17
	-std=gnu17

[env:esp32_release_legacy]
extends = env:esp32dev
build_unflags = 
	-std=gnu++11
	-std=gnu11
	-std=gnu++14
	-std=gnu14
build_flags = 
	-D DISPLAY_HAS_INTERNAL_RTC=0
	-std=gnu++17
	-std=gnu17

[env:display]
platform = atmelavr
framework = arduino
board_build.f_cpu = 8000000L
; TWI_BUFFER_SIZE por defecto es 32 bytes. Se amplía a 64 para recibir paquetes
; de hasta 64 bytes (p. ej., 5 header + 39 de texto clearing = 44 bytes).
build_flags =
	-DTWI_BUFFER_SIZE=64
; display.bin: imagen cruda para el bootloader I2C (ver scripts/avr_bin.py).
extra_scripts = post:scripts/avr_bin.py
custom_fw_bin_name = display
build_src_filter = ${env.src_filter}-<main.cpp>-<LLS.cpp>-<HC05.cpp>-<I2C_Master_Device.cpp>-<Keypad_I2C.cpp>-<MT124.cpp>-<Printer.cpp>-<Screen.cpp>-<Smartone.cpp>-<SPI_Device.cpp>-<State.cpp>-<mainPrinter.cpp>-<SD_Card.cpp>-<Peripehals.cpp>-<w5100.cpp>-<Ethernet.cpp>-<EthernetClient.cpp>-<Dns.cpp>-<Dhcp.cpp>-<Printer.cpp>-<Ethernet_HTTP.cpp>-<Ethernet_SocketIO.cpp>-<Ethernet_WebSocket.cpp>-<Logger.cpp>-<Global_Client.cpp>-<json_parser.cpp>

[env:display_debug]
extends = env:display
board = ATmega328P

[env:display_release]
extends = env:display
board = ATmega328PB

[env:printer]
platform = atmelavr
framework = arduino
board_build.f_cpu = 8000000L
; printer.bin: imagen cruda para el bootloader I2C (ver scripts/avr_bin.py).
extra_scripts = post:scripts/avr_bin.py
custom_fw_bin_name = printer
build_src_filter = ${env.src_filter}-<main.cpp>-<LLS.cpp>-<I2C_Master_Device.cpp>-<Keypad_I2C.cpp>-<MT124.cpp>-<Screen.cpp>-<Smartone.cpp>-<SPI_Device.cpp>-<State.cpp>-<mainDisplay.cpp>-<SD_Card.cpp>-<Peripehals.cpp>-<w5100.cpp>-<Ethernet.cpp>-<EthernetClient.cpp>-<Dns.cpp>-<Dhcp.cpp>-<Printer.cpp>-<Ethernet_HTTP.cpp>-<Ethernet_WebSocket.cpp>-<Logger.cpp>-<Ethernet_SocketIO.cpp>-<Global_Client.cpp>-<json_parser.cpp>

[env:printer_debug]
extends = env:printer
board = ATmega328P

[env:printer_release]
extends = env:printer
board = ATmega328PB


